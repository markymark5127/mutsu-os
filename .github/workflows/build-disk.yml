---
name: Build disk images

on:
  # Build ISO only AFTER the matching main image was published, signed AND
  # passed the GNOME runtime check (it starts the real Shell from that
  # image). An image that only built can still black out at login, as one
  # did; it must not become an installer.
  workflow_run:
    workflows: ["GNOME runtime check"]
    types: [completed]
    # Only watch releases built from main. PR container successes merely ran
    # validation and never pushed a GHCR image.
    branches: [main]
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'
      - 'branding/installer/**'
      - 'packaging/inject-iso-branding.sh'
      - 'packaging/build-installer-iso.sh'
      - 'packaging/installer/**'
      - 'tests/test_disk_image_workflow.py'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # Modern image-builder supports QCOW2 and container-based generic-iso.
  # Legacy anaconda-iso is not supported by this CLI.
  IB_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

# Do NOT cancel an image-build run because an unrelated container workflow
# finished (including cancelled, manual or PR runs). A previous version grouped
# all workflow_run events under refs/heads/main and killed real disk builds.
# Every independent request now completes or fails on its own.

jobs:
  validate:
    name: Validate disk workflow
    # Reject unsuccessful upstream runs BEFORE spending time on a runner.
    # Manual dispatch always validates, and PRs validate without building.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workflow_run's github.sha points to current main, NOT the source
          # that produced the completed image.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Validate disk-image contract
        run: |
          set -euo pipefail
          bash -n packaging/inject-iso-branding.sh
          bash -n packaging/build-installer-iso.sh
          python3 -m unittest discover -s tests -p 'test_disk_image_workflow.py' -v

  build:
    name: Build disk images
    needs: validate
    # PRs only validate. No PR should silently pull/publish an unrelated image.
    # Skip daily scheduled builds and any unsuccessful or non-main container run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_run')
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # Only build from an image that actually completed and was published.
    # Pull requests have no workflow_dispatch inputs: default them to amd64.
    # Keep the privileged OSBuild disk/ISO jobs on Ubuntu 24.04: on 26.04,
    # osbuild fails with EPERM while mounting /run/osbuild/containers/storage
    # (qcow2) or /run/osbuild/tree/dev (anaconda-iso). This is a temporary
    # runner compatibility pin until the image builder is qualified on 26.04.
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "generic-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt update -y
          sudo apt install -y podman skopeo xorriso cpio gzip imagemagick

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout matching Mutsu sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Resolve immutable container image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:7}"
          ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-${short_sha}"
          echo "Resolving Mutsu source ${SOURCE_SHA}: ${ref}"
          # Fails closed when this commit has no successfully published image.
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${ref}")"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Could not resolve an OCI digest for the exact Mutsu source commit"
            exit 1
          }
          pinned="${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}"
          echo "PINNED_IMAGE=${pinned}" >> "${GITHUB_ENV}"
          echo "Building disk artifacts from ${pinned} (source commit ${SOURCE_SHA})" >> "${GITHUB_STEP_SUMMARY}"

      # The published Mutsu image is the only installed payload; the ISO
      # builds its own Fedora-based Anaconda environment using generic-iso.
      - name: Build disk images
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          image_type="${{ matrix.disk-type }}"
          if [[ "${image_type}" == "generic-iso" ]]; then
            bash packaging/build-installer-iso.sh "${PINNED_IMAGE}" "${PWD}/output"
          else
            # Modern image-builder rejects legacy filesystem customizations.
            # Btrfs is selected here rather than in the blueprint.
            sudo podman run --rm --privileged \
              --security-opt label=type:unconfined_t \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              -v "${PWD}/output:/output" \
              -v "${PWD}/disk_config/disk.toml:/config.toml:ro" \
              "${IB_IMAGE}" build \
              --output-dir /output \
              --bootc-ref "${PINNED_IMAGE}" \
              --bootc-default-fs btrfs \
              --blueprint /config.toml \
              qcow2
          fi
          sudo chown -R "${USER_UID}:${USER_GID}" output || true
          echo "output-directory=${PWD}/output" >> "${GITHUB_OUTPUT}"

      # Mutsu artwork and .buildstamp are baked into the live installer;
      # legacy /images/product.img injection must not run on generic-iso.
      - name: Verify fresh ISO / QCOW2 and record exact container digest
        shell: bash
        env:
          OUTPUT_DIRECTORY: ${{ steps.build.outputs.output-directory }}
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          set -euo pipefail
          test -d "${OUTPUT_DIRECTORY}" || {
            echo "::error::Disk builder returned no output directory"
            exit 1
          }
          if [[ "${DISK_TYPE}" == "generic-iso" ]]; then
            artifact="$(find "${OUTPUT_DIRECTORY}" -type f -name '*.iso' -print -quit)"
          else
            artifact="$(find "${OUTPUT_DIRECTORY}" -type f -name '*.qcow2' -print -quit)"
          fi
          [[ -n "${artifact}" && -s "${artifact}" ]] || {
            echo "::error::No real ${DISK_TYPE} image produced"
            exit 1
          }
          if [[ "${DISK_TYPE}" == "generic-iso" ]]; then
            # The modern live Anaconda ISO has a SquashFS payload.
            xorriso -indev "${artifact}" -ls /LiveOS/squashfs.img >/dev/null
            xorriso -indev "${artifact}" -report_el_torito plain \
              | grep -Eiq '(UEFI|EFI)' || {
              echo "::error::ISO has no UEFI boot entry"
              exit 1
            }
          fi
          checksum_file="${OUTPUT_DIRECTORY}/MUTSU-SHA256SUMS.txt"
          sha256sum "${artifact}" > "${checksum_file}"
          {
            echo "MUTSU_SOURCE_SHA=${SOURCE_SHA}"
            echo "MUTSU_CONTAINER_IMAGE=${PINNED_IMAGE}"
            echo "MUTSU_DISK_TYPE=${DISK_TYPE}"
            echo "MUTSU_ARTIFACT=${artifact##*/}"
          } > "${OUTPUT_DIRECTORY}/MUTSU-BUILD-INFO.txt"
          echo "Created and validated: ${artifact}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Built from ${PINNED_IMAGE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Checksum: $(cat "${checksum_file}")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutsu-os-${{ matrix.disk-type == 'generic-iso' && 'anaconda-iso' || matrix.disk-type }}-${{ inputs.platform || 'amd64' }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
