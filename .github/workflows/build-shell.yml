name: Mutsu GNOME Shell (test build)

# Makes Mutsu's GNOME Shell overlay and theme on their own, in the same
# base image the OS uses, so a broken patch shows up in minutes instead of an hour into the
# image build. The image build runs the same script.
#
# The base image has more layers than Docker can stack ("max depth
# exceeded"), so it runs under Podman rather than as a job container.
on:
  workflow_dispatch:
  push:
    branches: [main, shell-test]
    paths:
      - 'packaging/shell/**'
      - '.github/workflows/build-shell.yml'

concurrency:
  group: build-shell
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Make Mutsu's Shell overlay and theme from the base image's Shell
        run: |
          mkdir -p out
          podman run --rm --privileged -v "$PWD:/src:Z" -w /src \
            ghcr.io/ublue-os/bazzite-gnome:stable bash -euxc '
              dnf5 -y install glib2-devel
              bash packaging/shell/make-shell-overlay.sh /src/out/overlay
              python3 packaging/shell/bake-shell-theme.py \
                /usr/share/gnome-shell/gnome-shell-theme.gresource /src/out/gnome-shell-theme.gresource \
                branding/shell/japandi.css \
                "extensions/mutsu-adaptive@mutsu-os/stylesheet.css::/* ---- Mutsu sage accent"
            '
      - name: The patched JavaScript parses
        run: |
          for f in out/overlay/ui/*.js; do cp "$f" "/tmp/$(basename "$f" .js).mjs"; node --check "/tmp/$(basename "$f" .js).mjs"; done
      - uses: actions/upload-artifact@v4
        with:
          name: mutsu-gnome-shell-overlay
          path: out/
          retention-days: 7
