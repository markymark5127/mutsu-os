# Weekly Mutsu OS Beta: every Friday, build main, run the GNOME runtime check
# on that exact image, and only if both pass, move the `beta` tag to it and
# publish a GitHub pre-release. Software Updates (mutsu-update-backend) and
# fresh installs follow `beta`, so nothing untested reaches a computer.
# Once published, both live USBs (offline and online) are built from it.
#
# Tags on ghcr.io/<owner>/mutsu-os:
#   beta                       the current Beta (moves every week)
#   beta-<version>-<date>      this Beta, forever (rollback, bug reports)
# Git tag / release: v<version>-beta.<date>  (version from packaging/release-version)
name: Beta release
on:
  schedule:
    - cron: '17 14 * * 5'  # Fridays 14:17 UTC (09:17 New York, winter time)
  workflow_dispatch:

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  image:
    name: Resolve the image that was built
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      digest: ${{ steps.resolve.outputs.digest }}
      repo: ${{ steps.resolve.outputs.repo }}
    steps:
      - name: Resolve the exact commit's image
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="latest-${GITHUB_SHA:0:7}"
          digest="$(skopeo inspect --creds "${GITHUB_ACTOR}:${GH_TOKEN}" --format '{{.Digest}}' "docker://${repo}:${tag}")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::No image for ${GITHUB_SHA}"; exit 1; }
          echo "Built ${repo}:${tag} (${digest})" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "tag=${tag}"
            echo "digest=${digest}"
            echo "repo=${repo}"
          } >> "$GITHUB_OUTPUT"

  runtime:
    needs: image
    uses: ./.github/workflows/gnome-runtime.yml
    permissions:
      contents: read
      packages: read
    with:
      image_tag: ${{ needs.image.outputs.tag }}

  publish:
    name: Publish the Beta
    needs: [image, runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # git tag + GitHub release
      packages: write   # move the beta tag
    outputs:
      # This Beta's permanent tag, so the live USBs carry exactly this build
      # even if another Beta moves `beta` while they are building.
      image_tag: beta-${{ steps.name.outputs.version }}-${{ steps.name.outputs.date_tag }}
      release_tag: v${{ steps.name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name this Beta
        id: name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.image.outputs.repo }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < packaging/release-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::packaging/release-version must be X.Y.Z"; exit 1; }
          date="$(date -u +%Y%m%d)"
          name="${version}-beta.${date}"
          # A second Beta on the same day (manual run) gets .2, .3, ...
          n=1
          while git rev-parse -q --verify "refs/tags/v${name}" >/dev/null; do
            n=$((n + 1)); name="${version}-beta.${date}.${n}"
          done
          echo "Mutsu OS ${name}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "version=${version}"
            echo "name=${name}"
            echo "image_tag=beta-${name#*-beta.}"
            echo "date_tag=${name#*-beta.}"
            echo "pretty=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      # Installed systems only accept Mutsu images signed with cosign.pub
      # (packaging/install-image-trust.sh). build.yml signs only on main, so
      # a manual run from another branch would hand every computer an update
      # it refuses: check the signature the way they will before moving beta.
      - name: Require the image's cosign signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.image.outputs.repo }}
          DIGEST: ${{ needs.image.outputs.digest }}
          KEY: cosign.pub
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          if ! skopeo copy --quiet --src-creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "docker://${REPO}:${DIGEST/:/-}.sig" "dir:${work}/sig"; then
            echo "::error::${REPO}@${DIGEST} has no cosign signature; signed systems would refuse it"; exit 1
          fi
          python3 - "${work}/sig" "$DIGEST" "$REPO" "$KEY" <<'PY'
          import base64, json, pathlib, subprocess, sys
          root, digest, repo, key = pathlib.Path(sys.argv[1]), *sys.argv[2:]
          for layer in json.loads((root / "manifest.json").read_text())["layers"]:
              blob = root / layer["digest"].split(":", 1)[1]
              critical = json.loads(blob.read_bytes())["critical"]
              if (critical["image"]["docker-manifest-digest"], critical["identity"]["docker-reference"]) != (digest, repo):
                  continue
              sig = root / "signature"
              sig.write_bytes(base64.b64decode(layer["annotations"]["dev.cosignproject.cosign/signature"]))
              if subprocess.run(["openssl", "dgst", "-sha256", "-verify", key, "-signature", str(sig), str(blob)],
                                capture_output=True).returncode == 0:
                  sys.exit(0)
          print(f"::error::{repo}@{digest} is not signed by {key}")
          sys.exit(1)
          PY
          echo "Signature verified against cosign.pub" >> "$GITHUB_STEP_SUMMARY"

      - name: Move the beta tag to the tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.image.outputs.repo }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ steps.name.outputs.version }}
          IMAGE_TAG: ${{ steps.name.outputs.image_tag }}
        run: |
          set -euo pipefail
          creds="${GITHUB_ACTOR}:${GH_TOKEN}"
          # Same digest as the image the runtime check passed (and that cosign
          # signed), so the signature still applies; nothing is rebuilt.
          for tag in "beta-${VERSION}-${IMAGE_TAG#beta-}" beta; do
            skopeo copy --all --preserve-digests --src-creds "$creds" --dest-creds "$creds" \
              "docker://${REPO}@${DIGEST}" "docker://${REPO}:${tag}"
          done
          moved="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://${REPO}:beta")"
          [[ "$moved" == "$DIGEST" ]] || { echo "::error::beta points at ${moved}, expected ${DIGEST}"; exit 1; }
          echo "beta → ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.name.outputs.name }}
          VERSION: ${{ steps.name.outputs.version }}
          PRETTY: ${{ steps.name.outputs.pretty }}
          IMAGE_TAG: ${{ steps.name.outputs.image_tag }}
          REPO: ${{ needs.image.outputs.repo }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<NOTES
          Weekly Mutsu OS Beta, built from ${GITHUB_SHA:0:7} and checked in a real GNOME session before release.

          **Updating:** Settings → Software Updates installs it (computers follow the \`beta\` tag automatically).
          **This exact build:** \`${REPO}:beta-${VERSION}-${IMAGE_TAG#beta-}\` (\`${DIGEST}\`)

          **Live USB:** attached below about an hour after this release, once both have passed their boot tests.
          - \`mutsu-os-${NAME}-live.iso.7z.*\`: installs without internet (~21 GB, 32 GB+ USB stick).
          - \`mutsu-os-${NAME}-live-online.iso.7z.*\`: smaller, downloads Mutsu OS while installing (~5 GB).

          Download **every** part of one variant into the same folder, then open the \`.7z.001\` file with
          [7-Zip](https://www.7-zip.org/) (Windows), [Keka](https://www.keka.io/) (macOS) or \`7z x\` (Linux).
          It extracts the bootable \`.iso\`; check it against the matching \`.iso.sha256\`, then write it with
          Fedora Media Writer (Custom Image). Writing it erases the USB stick.

          NOTES
          gh release create "v${NAME}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Mutsu OS ${VERSION} Beta (${PRETTY})" \
            --notes-file /tmp/notes.md \
            --generate-notes

  # Both live USBs for this Beta (offline ~21 GB, online ~5 GB). Each ends up
  # as an artifact on this run (mutsu-os-live-amd64, mutsu-os-live-online-amd64).
  live-usb-offline:
    name: Live USB (offline installer)
    needs: publish
    uses: ./.github/workflows/build-live-iso.yml
    permissions:
      contents: write   # attach the ISO parts to the release
      packages: read
    with:
      image_tag: ${{ needs.publish.outputs.image_tag }}
      variant: offline
      release_tag: ${{ needs.publish.outputs.release_tag }}
    secrets: inherit

  live-usb-online:
    name: Live USB (online installer)
    needs: publish
    uses: ./.github/workflows/build-live-iso.yml
    permissions:
      contents: write   # attach the ISO parts to the release
      packages: read
    with:
      image_tag: ${{ needs.publish.outputs.image_tag }}
      variant: online
      release_tag: ${{ needs.publish.outputs.release_tag }}
    secrets: inherit
