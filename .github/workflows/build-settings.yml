name: Mutsu GNOME Settings (test build)

# Builds Mutsu's GNOME Settings on its own, in the same base image the OS
# uses, so a broken patch shows up in minutes instead of an hour into the
# image build. The image build runs the same script.
#
# The base image has more layers than Docker can stack ("max depth
# exceeded"), so it runs under Podman rather than as a job container.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/settings/**'
      - '.github/workflows/build-settings.yml'

concurrency:
  group: build-settings
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build gnome-control-center with Mutsu's pages
        run: |
          mkdir -p out
          podman run --rm --privileged -v "$PWD:/src:Z" -w /src \
            ghcr.io/ublue-os/bazzite-gnome:stable bash -euxc '
              bash packaging/settings/build-gnome-settings.sh /src/out
              rpm2cpio out/gnome-control-center-[0-9]*.rpm | cpio -t 2>/dev/null | grep -E "gnome-mutsu-updates-panel.desktop"
              dnf5 -y install out/*.rpm
              rpm -q gnome-control-center | grep mutsu
              strings "$(command -v gnome-control-center)" | grep -q mutsu-updates
            '
      - uses: actions/upload-artifact@v7
        with:
          name: mutsu-gnome-settings-rpms
          path: out/*.rpm
          retention-days: 7
