---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    # Match the privileged disk-image job's tested runner generation.
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check pinned desktop and Mutsu integration before building
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/prepare-desktop.sh
          python3 packaging/check-integration.py
          python3 packaging/check-branding-assets.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_tablet_switcher.cjs extensions/mutsu-adaptive@mutsu-os/tabletSwitcher.js
          node tests/test_tablet_layout.cjs extensions/mutsu-adaptive@mutsu-os
          node tests/test_tablet_keyboard.cjs extensions/mutsu-adaptive@mutsu-os/tabletKeyboard.js
          node tests/test_tablet_dock.cjs extensions/mutsu-adaptive@mutsu-os/tabletDock.js
          node tests/test_search_integration.cjs extensions/mutsu-branding@mutsu-os/searchIntegration.js
          for script in extensions/mutsu-adaptive@mutsu-os/*.js; do
            node --check "$script"
          done
          PYTHONPATH=vendor/ai-desktop/src python3 -m unittest discover -s vendor/ai-desktop/tests -p 'test_*.py' -v
          # Record exactly which reviewed desktop code this immutable image uses.
          cat packaging/desktop-source.env
          bash -n packaging/prepare-desktop.sh
          bash -n packaging/install-adaptive-extension.sh
          bash -n packaging/install-shell-branding.sh
          bash -n packaging/render-plymouth-theme.sh
          bash -n packaging/verify-upstream-initramfs.sh
          bash -n packaging/rebuild-mutsu-initramfs.sh
          bash -n packaging/install-newelle.sh
          bash -n packaging/build-newelle-dependencies.sh
          bash -n packaging/prepare-newelle.sh
          bash -n packaging/setup-newelle-user.sh
          # Catch installer, keyd and branding script errors BEFORE OCI building.
          for script in build_files/build.sh \
                        packaging/install-branding.sh \
                        packaging/install-mac-shortcuts.sh \
                        packaging/inject-iso-branding.sh \
                        packaging/configure-shortcut-defaults.sh; do
            bash -n "$script"
          done
          # New desktop defaults are generated inside the OS image, not at
          # user login. Validate the build-only configurator before OCI work.
          python3 -m py_compile packaging/configure-native-desktop.py
          python3 -m py_compile packaging/verify-native-desktop.py

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Install native Flatpak preparation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak dbus-daemon zstd

      - name: Allow native Flatpak namespaces on the ephemeral build runner
        shell: bash
        run: |
          set -euo pipefail
          # Native Flatpak runs on the host, outside Podman. Limit Ubuntu's
          # userns-policy adjustment to this disposable preparation job.
          policy=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$policy" ]]; then
            echo "MUTSU_PREVIOUS_USERNS_POLICY=$(cat "$policy")" >> "$GITHUB_ENV"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Prepare offline Newelle on the host
        run: |
          dbus-run-session -- bash packaging/prepare-newelle.sh

      - name: Restore runner namespace policy
        if: always()
        shell: bash
        run: |
          if [[ -n "${MUTSU_PREVIOUS_USERNS_POLICY:-}" ]]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=${MUTSU_PREVIOUS_USERNS_POLICY}"
          fi

      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          # GitHub Actions tests/staging can leave untracked build outputs.
          # Justfile intentionally omits SHA aliases when `git status` is dirty;
          # the disk workflow, however, REQUIRES a tag for its exact source SHA.
          # Assign that tag explicitly on trusted main builds, independent of
          # workstation cleanliness, so no future ISO depends on stale latest.
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            source_tag="${DEFAULT_TAG}-${GITHUB_SHA:0:7}"
            if [[ " ${alias_tags} " != *" ${source_tag} "* ]]; then
              alias_tags+=" ${source_tag}"
            fi
          fi

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

