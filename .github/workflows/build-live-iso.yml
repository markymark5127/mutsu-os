name: Build Mutsu Live USB ISO (manual)

# Intentionally no push, pull_request, schedule, or workflow_run events.
# The live desktop is experimental and should be built only on demand.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published GHCR tag (latest or latest-<7-character commit SHA>)"
        required: true
        type: string
        default: latest
      variant:
        description: "offline: the USB carries the system and apps, installs without internet (~21 GB). online: small USB, installs over the internet (~5 GB)."
        required: true
        type: choice
        options: [offline, online]
        default: offline
  # The "online installer" workflow (build-live-iso-online.yml) reuses this.
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      variant:
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: mutsu-live-iso-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  build-live-iso:
    name: Build and verify live desktop ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Mutsu live-ISO sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate the manual input and live-only contract
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          [[ "$INPUT_TAG" =~ ^latest(-[a-f0-9]{7})?$ ]] || {
            echo "::error::Use latest or latest-<7-character lowercase commit SHA>"
            exit 1
          }
          [[ "$INPUT_VARIANT" == offline || "$INPUT_VARIANT" == online ]] || {
            echo "::error::variant must be offline or online"
            exit 1
          }
          echo "IMAGE_TAG=$INPUT_TAG" >> "$GITHUB_ENV"
          echo "LIVE_VARIANT=$INPUT_VARIANT" >> "$GITHUB_ENV"
          echo "Live USB variant: $INPUT_VARIANT" >> "$GITHUB_STEP_SUMMARY"
          python3 -m unittest discover -s tests -p 'test_live_iso_workflow.py' -v

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install ISO and QEMU dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            podman skopeo jq xorriso mtools squashfs-tools dosfstools \
            systemd-boot systemd-boot-efi gdisk qemu-system-x86 ovmf

      - name: Resolve and pull exact published Mutsu image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):$IMAGE_TAG"
          digest="$(sudo skopeo inspect --format '{{.Digest}}' "docker://$image")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Failed to resolve a published Mutsu OCI digest"
            exit 1
          }
          pinned="${image%:*}@$digest"
          sudo podman pull "$pinned"
          sudo podman image exists "$pinned"
          echo "PINNED_IMAGE=$pinned" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=$image" >> "$GITHUB_ENV"
          echo "Live desktop image: $pinned" >> "$GITHUB_STEP_SUMMARY"

      # Tacklebox contains dracut live-root modules and live-user/GDM setup.
      # Pin upstream commit instead of executing a moving latest tag.
      - name: Checkout pinned Tacklebox live image builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuna-os/tacklebox
          ref: bbd0b0edeb13363045d7435097761c670d030c88
          path: .tacklebox
          persist-credentials: false

      - name: Set up pinned Tacklebox Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .tacklebox/go.mod
          cache: false

      # The pinned Tacklebox ISO writer defines an El Torito EFI image but
      # omits the USB partition-entry flag. Optical boot can therefore work
      # while DD-written sticks expose only the firmware option.
      - name: Enable hybrid UEFI USB boot in pinned Tacklebox
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path(".tacklebox/internal/target/iso.go")
          old = '"-boot_image", "any", "part_like_isohybrid=on",'
          new = old + '\n\t\t"-boot_image", "isolinux", "partition_entry=gpt_basdat",'
          content = source.read_text()
          if content.count(old) != 1:
              raise SystemExit("Pinned Tacklebox ISO writer changed: review USB patch")
          source.write_text(content.replace(old, new, 1))
          print("Enabled EFI partition entry for USB-hybrid ISO")
          PY
          grep -F 'partition_entry=gpt_basdat' .tacklebox/internal/target/iso.go

      - name: Build Tacklebox
        run: |
          set -euo pipefail
          cd .tacklebox
          go build -o ../tacklebox ./cmd/tacklebox
          ../tacklebox --help

      - name: Prepare digest-pinned live desktop recipe
        run: |
          set -euo pipefail
          mkdir -p mutsu-live-out
          # offline_payloads: the system image itself goes on the USB (under
          # the name the installed system updates from), so "Install Mutsu
          # OS" needs no network and nothing is pulled into the live RAM.
          # The customize script reads the variant from a file beside it
          # (its directory is mounted into the build container).
          printf 'MUTSU_LIVE_VARIANT=%s\n' "$LIVE_VARIANT" > packaging/live/variant.env
          jq --arg image "$PINNED_IMAGE" --arg customize "$PWD/packaging/live/customize.sh" \
            --arg ref "${SOURCE_TAG%:*}:latest" --arg variant "$LIVE_VARIANT" \
            '.bootable_environments[0].image = $image
             | .bootable_environments[0].live_customize = [$customize]
             | if $variant == "offline" then
                 .offline_payloads = [{source: $image, ref: $ref}]
                 | .shared_store.prune_source_images = true
               else . end' \
            packaging/live/recipe.json > mutsu-live-out/recipe.json
          jq -e --arg image "$PINNED_IMAGE" \
            '.bootable_environments | length == 1 and .[0].image == $image and .[0].modes == ["live"] and .[0].desktop == "gnome"' \
            mutsu-live-out/recipe.json

      - name: Build Mutsu desktop Live ISO
        id: iso
        run: |
          set -euo pipefail
          # The ISO target uses a temporary writable RAM overlay on the live
          # squashfs; it does NOT install or repartition the host.
          # NET_ADMIN: flatpak's sandbox needs it to install the default
          # apps (Firefox, ...) into the live system.
          # Online variant: apps are installed on the disk after the first
          # boot (mutsu-flatpak-preinstall), so only Firefox is put on the USB.
          preinstall=1
          [[ "$LIVE_VARIANT" == online ]] && preinstall=0
          sudo env TBOX_CUSTOMIZE_CAPS=NET_ADMIN TBOX_FLATPAK_PREINSTALL=$preinstall \
            ./tacklebox build mutsu-live-out/recipe.json \
            --iso "$PWD/mutsu-live-out/mutsu-os-live.iso" \
            -b "$PWD/mutsu-live-out/build"
          sudo chown -R "$(id -u):$(id -g)" mutsu-live-out
          test -s mutsu-live-out/mutsu-os-live.iso

      - name: Verify ISO metadata and checksum
        run: |
          set -euo pipefail
          ./tacklebox verify mutsu-live-out/mutsu-os-live.iso
          xorriso -indev mutsu-live-out/mutsu-os-live.iso \
            -report_el_torito plain | tee mutsu-live-out/efi-layout.txt
          grep -Eiq '(EFI|UEFI)' mutsu-live-out/efi-layout.txt
          xorriso -indev mutsu-live-out/mutsu-os-live.iso \
            -report_system_area plain | tee mutsu-live-out/usb-layout.txt
          (
            cd mutsu-live-out
            sha256sum mutsu-os-live.iso > MUTSU-LIVE-SHA256SUMS.txt
            sha256sum -c MUTSU-LIVE-SHA256SUMS.txt
          )
          {
            echo "MUTSU_CONTAINER_IMAGE=$PINNED_IMAGE"
            echo "MUTSU_SOURCE_TAG=$SOURCE_TAG"
            echo "MUTSU_WORKFLOW_SHA=$GITHUB_SHA"
            echo "TACKLEBOX_COMMIT=bbd0b0edeb13363045d7435097761c670d030c88"
          } > mutsu-live-out/MUTSU-LIVE-BUILD-INFO.txt
          echo "Live USB ISO assembled and structurally verified." >> "$GITHUB_STEP_SUMMARY"

      # Try booting all the way through the live root with UEFI in QEMU.
      # Treat a failed boot as a failed build, even when the ISO structure is valid.
      # A serial-login test is not a complete graphical-desktop test, but its
      # failure must not leave an unverified ISO looking like a green release.
      # GitHub's Ubuntu runners expose /dev/kvm, but only root can open it
      # by default. Without this, QEMU falls back to software emulation
      # (accel=tcg), and a full Bazzite GNOME desktop cannot reach a login
      # prompt within the timeout. Every earlier boot test ran under TCG.
      - name: Enable KVM acceleration for boot tests
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ -w /dev/kvm ]]; then
            echo "QEMU boot tests use KVM acceleration." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::/dev/kvm unavailable: boot tests fall back to slow software emulation"
          fi

      - name: Headless QEMU UEFI boot smoke test
        id: smoke
        env:
          QEMU_LIVE_LOG: ${{ github.workspace }}/mutsu-live-out/qemu-live-boot.log
        run: |
          set -euo pipefail
          bash .tacklebox/scripts/test-live-boot.sh \
            mutsu-live-out/mutsu-os-live.iso 900

      # The above optical-drive test checks El Torito. Real flash drives
      # written in DD mode boot through the raw USB partition table instead.
      # Runs even when the optical test fails, so both boot logs exist.
      - name: Raw USB UEFI boot smoke test
        id: usb-smoke
        if: always() && steps.iso.outcome == 'success'
        env:
          QEMU_LIVE_LOG: ${{ github.workspace }}/mutsu-live-out/qemu-usb-boot.log
        run: |
          set -euo pipefail
          bash packaging/live/test-usb-boot.sh \
            mutsu-live-out/mutsu-os-live.iso 900

      # Reaching a serial login prompt does not prove the desktop logs in.
      # The live session service must have run (creates liveuser, turns on
      # GDM automatic login), or users land on an unusable login screen.
      - name: Check live automatic login was set up
        if: steps.smoke.outcome == 'success'
        run: |
          # The console colours unit names (ESC[0;1;39m) and truncates them.
          if sed 's/\x1b\[[0-9;]*m//g' mutsu-live-out/qemu-live-boot.log | grep -q 'Finished mutsu-live-sess'; then
            echo "Live session: automatic login as liveuser configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::mutsu-live-session.service did not finish: the live USB would stop at a login screen"
            grep -i 'live-session\|liveuser' mutsu-live-out/qemu-live-boot.log || true
            exit 1
          fi

      # "Install Mutsu OS" installs from the system image on the USB. Its
      # store must be mounted in the live session.
      - name: Check the installer's system image is available offline
        if: steps.smoke.outcome == 'success' && inputs.variant == 'offline'
        run: |
          if sed 's/\x1b\[[0-9;]*m//g' mutsu-live-out/qemu-live-boot.log | grep -q 'Mounted.*superiso'; then
            echo "Installer: system image mounted from the USB (offline install ready)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The installer's offline system image (LiveOS/store.squashfs.img) was not mounted"
            sed 's/\x1b\[[0-9;]*m//g' mutsu-live-out/qemu-live-boot.log | grep -i 'superiso\|store.squashfs' || true
            exit 1
          fi

      # The filtered tail printed by the boot scripts hides where a boot
      # actually stopped. Show the real end of each serial log here.
      - name: Show end of boot logs
        if: always() && steps.iso.outcome == 'success'
        run: |
          for log in mutsu-live-out/qemu-live-boot.log mutsu-live-out/qemu-usb-boot.log; do
            [[ -s "$log" ]] || continue
            echo "::group::Last 120 lines of $log"
            sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' -e 's/\r//g' "$log" | grep -v '^\s*$' | tail -120
            echo "::endgroup::"
          done

      - name: Summarize boot test result
        if: always() && steps.iso.outcome == 'success'
        env:
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          USB_SMOKE_RESULT: ${{ steps.usb-smoke.outcome }}
        run: |
          if [[ "$SMOKE_RESULT" == "success" && "$USB_SMOKE_RESULT" == "success" ]]; then
            echo "Both optical and raw USB QEMU UEFI boot tests passed (live login reached)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::QEMU optical or raw USB boot failed. Inspect both boot logs before writing a USB."
            echo "FAILED: Live optical/USB boot not fully confirmed. ISO is diagnostic-only, not a verified release." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Small separate artifact: boot logs can be read without downloading
      # the multi-gigabyte ISO.
      - name: Upload boot logs
        if: always() && steps.iso.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.variant == 'online' && 'mutsu-os-live-online-boot-logs' || 'mutsu-os-live-boot-logs' }}
          path: |
            mutsu-live-out/qemu-live-boot.log
            mutsu-live-out/qemu-usb-boot.log
            mutsu-live-out/MUTSU-LIVE-BUILD-INFO.txt
          if-no-files-found: warn
          retention-days: 14

      # Upload evidence on boot failure so the actual root cause can be investigated.
      - name: Upload Mutsu Live ISO and diagnostics
        if: always() && steps.iso.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.variant == 'online' && 'mutsu-os-live-online-amd64' || 'mutsu-os-live-amd64' }}
          path: |
            mutsu-live-out/mutsu-os-live.iso
            mutsu-live-out/MUTSU-LIVE-SHA256SUMS.txt
            mutsu-live-out/MUTSU-LIVE-BUILD-INFO.txt
            mutsu-live-out/efi-layout.txt
            mutsu-live-out/usb-layout.txt
            mutsu-live-out/qemu-live-boot.log
            mutsu-live-out/qemu-usb-boot.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
