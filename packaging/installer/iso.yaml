# Source of the bootc *installer* ISO boot label and GRUB menu branding.
# The original entry omitted this installer-only SELinux workaround and
# systemd could not label /dev/tty* on real hardware. The installed Mutsu
# OS image does not inherit this kernel argument.
label: MUTSU_OS
grub2:
  timeout: 8
  entries:
    - name: "Install Mutsu OS"
      linux: "/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=MUTSU_OS inst.graphical selinux=0 rhgb quiet"
      initrd: "/images/pxeboot/initrd.img"
