# Mutsu OS Mac-style shortcuts.
# Super (Windows / Command position) acts as Command.
# Held Super+letter becomes Ctrl+letter so GTK/Qt apps treat it as copy, paste, etc.
# A bare Super tap still opens the GNOME overview.

[ids]
*

[main]
leftmeta = overload(mac, leftmeta)
rightmeta = overload(mac, rightmeta)

# :C means this layer includes Control, so Super+C is Ctrl+C, Super+V is Ctrl+V.
[mac:C]
# Keep Mutsu Search on Super+Space instead of turning it into Ctrl+Space.
space = M-space
# Super+Tab switches apps (GNOME already binds Alt+Tab).
tab = A-tab
# Super+` cycles windows of the same app, Mac-style.
grave = A-grave
# Command+arrows move to line / document edges, like a Mac.
left = home
right = end
up = C-home
down = C-end
# Command+Backspace deletes to the start of the line.
backspace = macro(S-home backspace)
# Command+H and Command+M put the window away (GNOME minimizes on Super+H).
h = M-h
m = M-h

# Option (Alt) moves and deletes by word, like a Mac.
[alt]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete
