# Mutsu OS: make compressed RAM swap (zram) as large as RAM.
#
# Bazzite's /etc/systemd/zram-generator.conf sizes it at half of RAM. zstd
# packs swapped-out pages about 3:1, so a zram device the size of RAM still
# only takes about a third of RAM once full. On 8 GB laptops the half-size
# device filled up after a few days of browsing and the desktop slowed down.
# Drop-ins override keys in the main file, including the one in /etc.
[zram0]
zram-size = min(ram, 16384)
compression-algorithm = zstd
