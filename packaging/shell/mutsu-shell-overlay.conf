# Mutsu OS: GNOME Shell reads two of its own files from Mutsu's copy, which
# makes the login animation wait for extensions (see
# /usr/share/mutsu-os/shell-overlay and packaging/shell in the Mutsu repo).
# Everything else still comes from the Shell itself.
[Service]
Environment=G_RESOURCE_OVERLAYS=/org/gnome/shell/ui=/usr/share/mutsu-os/shell-overlay/ui
