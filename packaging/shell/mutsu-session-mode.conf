# Mutsu OS: the user session's GNOME Shell runs in Mutsu's session mode
# (/usr/share/gnome-shell/modes/mutsu.json, written at image build by
# configure-native-desktop.py). It is GNOME's own user session plus Mutsu's
# components (dock, menu bar, window buttons, tablet mode) for every user.
# Only this instance: the login screen and initial setup keep their modes.
# If the mode file were missing, GNOME falls back to the plain user session.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-shell --mode=mutsu
