<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Shoji Glass "Show Apps": nine round dots and no tile, like the dock in
       the Shoji Glass render. Symbolic, so the Shell paints the dots in the
       icon colour (bright white on the Japandi dock, cyan in Cyberpunk). -->
  <g fill="#2e3436">
    <circle cx="3" cy="3" r="1.6"/><circle cx="8" cy="3" r="1.6"/><circle cx="13" cy="3" r="1.6"/>
    <circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="13" cy="8" r="1.6"/>
    <circle cx="3" cy="13" r="1.6"/><circle cx="8" cy="13" r="1.6"/><circle cx="13" cy="13" r="1.6"/>
  </g>
</svg>
